# Vet and test every push and pull request to main.
# Actions are pinned to full commit SHAs. The only network use is checkout and
# setup-go's download of the Go version go.mod names; the build itself runs
# with the module proxy off.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: vet
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: go vet ./...
      - name: test
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: go test -count=1 ./...
